name: Build BilliEnoughFakepixel 1.21.1 JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip mod source
        run: unzip -o *.zip


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BEF mod JAR
        working-directory: BilliEnoughFakepixel-1.21.1
        run: gradle build

      - name: Upload BEF mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BilliEnoughFakepixel-Fabric-1.21.1
          path: |
            BilliEnoughFakepixel-1.21.1/build/libs/*.jar
            !BilliEnoughFakepixel-1.21.1/build/libs/*-sources.jar
concurrency: 
